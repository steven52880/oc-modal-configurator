name: Draft Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (defaults to v<version> from frontend/package.json)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Windows package
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"

          $Tag = $env:INPUT_TAG
          if ([string]::IsNullOrWhiteSpace($Tag)) {
            $Version = (Get-Content -Raw "frontend/package.json" | ConvertFrom-Json).version
            if ([string]::IsNullOrWhiteSpace($Version)) {
              throw "frontend/package.json has no version field."
            }
            $Tag = "v$Version"
          }
          $Tag = $Tag.Trim()

          if ($Tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$') {
            throw "Invalid release tag '$Tag'. Expected something like v1.4.0."
          }

          Write-Host "Release tag: $Tag"
          "tag=$Tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Create virtual environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m venv venv
          venv\Scripts\python.exe -m pip install --upgrade pip
          venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Run backend unit tests
        shell: pwsh
        run: venv\Scripts\python.exe -m unittest discover -s tests -v

      - name: Build Windows package
        shell: pwsh
        run: ./packaging/build_windows.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: packaging/output/oc-modal-configurator-windows.zip
          if-no-files-found: error

      - name: Create or update draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          draft: true
          files: packaging/output/oc-modal-configurator-windows.zip
